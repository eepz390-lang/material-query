<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#123b5d">
<title>物料查询 · Material Finder</title>
<style>
:root{--navy:#123b5d;--blue:#176b87;--teal:#19a7a0;--bg:#f3f7fa;--ink:#1b2b3a;--muted:#718096;--line:#e3ebf1;--white:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Segoe UI","Microsoft YaHei",Arial,sans-serif}
header{background:linear-gradient(120deg,#102f4b,#176b87);color:white;padding:26px 18px 62px}
.top{max-width:1040px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:16px}
.brand{font-weight:800;letter-spacing:.3px;font-size:20px}.brand small{display:block;font-size:11px;font-weight:500;opacity:.75;letter-spacing:2px;margin-top:5px}
.pill{border:1px solid #ffffff55;border-radius:30px;padding:8px 12px;font-size:12px;color:#e7f7ff}
main{max-width:1040px;margin:-38px auto 40px;padding:0 16px}
.panel{background:white;border-radius:20px;padding:22px;box-shadow:0 12px 35px #173c5810;border:1px solid #e9f0f5}
h1{font-size:24px;margin:0 0 7px}.sub{color:var(--muted);font-size:13px;margin-bottom:22px}
.searchgrid{display:grid;grid-template-columns:190px 1fr auto;gap:12px;align-items:end}
label{font-size:12px;color:#536577;font-weight:700;display:block;margin:0 0 8px}
select,input{width:100%;height:48px;border:1px solid #d9e3eb;border-radius:12px;background:#fbfdff;padding:0 13px;font-size:15px;color:var(--ink);outline:none}
select:focus,input:focus{border-color:var(--teal);box-shadow:0 0 0 3px #19a7a01b}
button{height:48px;border:0;border-radius:12px;background:var(--teal);color:white;font-weight:750;padding:0 22px;font-size:14px;cursor:pointer}
button:hover{filter:brightness(.96)}.hint{font-size:12px;color:var(--muted);margin-top:12px}
.stats{display:flex;gap:9px;flex-wrap:wrap;margin:17px 0 0}.stat{background:#f0f7f9;color:#456171;border-radius:9px;padding:7px 10px;font-size:12px}
.results-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:24px 2px 12px}.results-head h2{font-size:17px;margin:0}.count{font-size:12px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.item{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;display:grid;grid-template-columns:140px 1fr;min-height:190px;box-shadow:0 5px 20px #173c5807}
.photo{background:#f8fafc;display:flex;align-items:center;justify-content:center;padding:10px;border-right:1px solid #edf1f4;min-width:0}
.photo img{width:100%;height:160px;object-fit:contain}.noimg{color:#a3b2bf;font-size:12px;text-align:center}
.info{padding:15px;min-width:0}.code{font-size:17px;font-weight:800;color:var(--navy);overflow-wrap:anywhere}.name{font-weight:650;font-size:13px;line-height:1.5;margin-top:6px}.eng,.thai{font-size:11px;color:var(--muted);line-height:1.45;margin-top:4px}
.meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.tag{border-radius:8px;background:#edf8f7;color:#087e79;font-size:12px;padding:6px 8px;font-weight:700}.tag.model{background:#edf3fa;color:#285b86}
.empty{background:white;border:1px dashed #cbd8e2;border-radius:16px;text-align:center;padding:36px 20px;color:var(--muted);grid-column:1/-1}.empty strong{display:block;color:#34495b;margin-bottom:6px}
footer{text-align:center;color:#93a1ad;font-size:11px;padding:24px 12px 34px}
@media(max-width:720px){header{padding-bottom:58px}.brand{font-size:18px}.pill{font-size:11px}.panel{padding:17px;border-radius:17px}h1{font-size:21px}.searchgrid{grid-template-columns:1fr;gap:13px}.searchgrid button{width:100%}.cards{grid-template-columns:1fr}.item{grid-template-columns:112px 1fr;min-height:165px}.photo img{height:140px}.info{padding:12px}.code{font-size:16px}}
</style>
</head>
<body>
<header><div class="top"><div class="brand">物料智查 <small>MATERIAL FINDER · 物料图像与用量查询</small></div><div class="pill">手机 / 电脑均可使用</div></div></header>
<main>
<section class="panel">
<h1>快速查询物料</h1><div class="sub">选择机型，再输入物料代码或名称，即可查看图片、基本用量与适用机型。</div>
<div class="searchgrid">
<div><label for="model">选择机型</label><select id="model"><option value="全部">全部机型</option><option value="2900">2900</option><option value="1800">1800</option><option value="1100">1100</option></select></div>
<div><label for="keyword">物料代码 / 物料名称</label><input id="keyword" placeholder="例如：21.01.0008 或 M5×12" autocomplete="off"></div>
<button id="search">查询物料</button>
</div>
<div class="hint">支持输入完整物料代码或关键词；选择“全部机型”可查看共用物料及适用机型。</div>
<div class="stats"><span class="stat">机型：2900 / 1800 / 1100</span><span class="stat" id="total">物料载入中…</span><span class="stat">免费静态网页</span></div>
</section>
<div class="results-head"><h2>查询结果</h2><span class="count" id="count">准备中</span></div>
<section class="cards" id="results"><div class="empty"><strong>正在载入物料资料</strong>请稍候…</div></section>
</main>
<footer>物料智查 · 数据来自已提供的物料表格 · 如需更新资料，请替换 data.json 和 images 文件夹</footer>
<script>
const $=id=>document.getElementById(id);let materials=[];
const models=["2900","1800","1100"];
function applicable(code){return [...new Set(materials.filter(x=>x.code===code).map(x=>x.model))]}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function render(){
 const model=$("model").value, q=$("keyword").value.trim().toLowerCase();
 let list=materials.filter(x=>(model==="全部"||x.model===model)&&(!q||[x.code,x.name,x.english,x.thai].some(v=>String(v||"").toLowerCase().includes(q))));
 list.sort((a,b)=>a.code.localeCompare(b.code,undefined,{numeric:true}));
 $("count").textContent=`找到 ${list.length} 条物料`;
 if(!list.length){$("results").innerHTML='<div class="empty"><strong>没有找到匹配物料</strong>请检查机型或物料代码，也可以尝试输入名称关键词。</div>';return}
 $("results").innerHTML=list.slice(0,100).map(x=>{
 const ms=applicable(x.code);return `<article class="item"><div class="photo">${x.image?`<img loading="lazy" src="${esc(x.image)}" alt="${esc(x.code)}" onerror="this.outerHTML='<div class=&quot;noimg&quot;>暂无图片</div>'">`:'<div class="noimg">暂无图片</div>'}</div><div class="info"><div class="code">${esc(x.code)}</div><div class="name">${esc(x.name)}</div>${x.english?`<div class="eng">${esc(x.english)}</div>`:''}${x.thai?`<div class="thai">${esc(x.thai)}</div>`:''}<div class="meta"><span class="tag">用量：${esc(x.qty)} ${esc(x.unit)}</span><span class="tag model">适用：${ms.join(" / ")}</span></div></div></article>`
 }).join("")+(list.length>100?'<div class="empty">当前显示前 100 条，请输入更具体的关键词缩小范围。</div>':'');
}
$("search").addEventListener("click",render);$("model").addEventListener("change",render);$("keyword").addEventListener("input",render);$("keyword").addEventListener("keydown",e=>{if(e.key==="Enter")render()});
fetch("data.json").then(r=>{if(!r.ok)throw Error("data.json加载失败");return r.json()}).then(d=>{materials=d;$("total").textContent=`已载入 ${d.length} 条物料`;render()}).catch(()=>{$("total").textContent="资料载入失败";$("results").innerHTML='<div class="empty"><strong>无法读取物料资料</strong>请确认 data.json 与 index.html 放在同一目录，并通过网站地址打开。</div>'});
</script>
</body></html>
